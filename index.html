<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="app.css" />

    <title>Frontend Mentor | Product preview card component</title>
  </head>
  <body>
    <main class="box">
      <img
        class="perfume-mobile"
        src="./image-product-mobile.jpg"
        alt="Perfume Bottle"
        width="350"
        height="340"
      />
      <img
        class="perfume-desktop"
        src="./image-product-desktop.jpg"
        alt="Pefume Bottle"
      />
      <div class="content">
        <header>Perfume</header>
        <h1>Gabrielle Essence Eau De Parfum</h1>
        <p>
          A floral, solar and voluptuous interpretation composed by Olivier
          Polge, Perfumer-Creator for the House of CHANEL.
        </p>
        <section class="pricing">
          <data class="sale" value="149.99">$149.99</data>
          <del class="originalprice"><data value="169.99">$169.99</data></del>
        </section>
        <button>
          <img class="cart" src="./icon-cart.svg" alt="shopping cart" />Add
          to Cart
        </button>
      </div>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/arielvonlestat">AVL</a>.
    </footer>
  </body>
</html>
